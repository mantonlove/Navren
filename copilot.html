<div class="app">
  <nav class="sidebar" aria-label="顾问演示导航">
    <a class="logo" href="chat.html" aria-label="返回个人视角"><img class="brand-icon" src="assets/brand/navren-icon.png" alt=""></a>
    <a class="nav-item" id="advisorReturn" href="chat.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m14 6-6 6 6 6"/></svg><span class="nav-label">返回</span></a>
  </nav>
  <main class="main" id="mainContent" tabindex="-1">
    <header class="header">
      <div class="header-identity"><a class="brand" href="chat.html" aria-label="Navren首页"><img class="brand-wordmark" src="assets/brand/navren-wordmark.png" width="2172" height="724" alt=""></a><h1 class="header-location" data-view-heading tabindex="-1">顾问视角 · 演示</h1></div>

    </header>
    <section id="accountSwitcher" aria-label="演示账户" class="account-switcher" hidden></section>

    <div class="page-scroll">
    <div class="rec-page workbench-page">


      <!-- 客户信息摘要 -->
      <div class="mine-section">
        <div class="sec-label">客户信息</div>
        <div class="card" id="clientProfile"></div>
      </div>

      <!-- 最近关注 + 推荐话术 -->
      <div class="mine-section">
        <div class="sec-label">对话记录与沟通建议</div>
        <div class="card" id="talkingPoints"></div>
      </div>

      <!-- 产品推荐亮点 -->
      <div class="mine-section">
        <div class="sec-label">参考产品</div>
        <div class="rec-current" id="productHighlights"></div>
      </div>

      <!-- 合规提示 -->
      <div class="mine-section">
        <div class="sec-label">建议边界</div>
        <p class="workbench-boundary">当前服务对象是你的本机演示账户。本视角没有额外银行顾问权限，仅在已授权范围内整理信息。</p>
        <div id="complianceNotes" style="padding:14px;border-radius:var(--r-sm);font-size:var(--font-size-xs);line-height:1.8"></div>
      </div>

    </div>
    </div>
  </main>
