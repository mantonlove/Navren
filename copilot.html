<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
<script data-navren-theme-bootstrap>
(() => {
  try {
    const theme=localStorage.getItem('navren:paint-theme:v1');
    if(theme!=='light'&&theme!=='dark')return;
    const root=document.documentElement;
    root.dataset.theme=theme;root.style.colorScheme=theme;
    root.style.backgroundColor=theme==='dark'?'#0d1725':'#edf3fa';
  } catch(_) {}
})();
</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Navren · 我的</title>
<link rel="stylesheet" href="css/form_controls.css?dq=546db5bc506d">
  <link rel="stylesheet" href="css/quiet_focus.css?v=fb63a47fe877">
</head>
<body>
  <p>正在返回我的…</p>
  <a id="returnMine" href="mine.html">返回我的</a>
  <script>
    (() => {
      const target = new URL('mine.html', location.href);
      const current = new URLSearchParams(location.search);
      for (const key of ['ui', 'mode']) {
        const value = current.get(key);
        if (value) target.searchParams.set(key, value);
      }
      document.getElementById('returnMine').href = target.href;
      location.replace(target.href);
    })();
  </script>
<script src="js/form_controls.js?dq=b4539a70b618"></script>
</body>
</html>
