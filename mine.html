<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Navren · 我的</title>
<link rel="stylesheet" href="css/style.css?v=ui-20261003-3">
<link rel="stylesheet" href="css/design.css?v=ui-20261003-3">
</head>
<body data-page="mine">
<a class="skip-link" href="#mainContent">跳到主要内容</a>

<div class="app">
  <nav class="sidebar" aria-label="Navren主导航">
    <a class="logo" href="index.html" aria-label="Navren首页"><img src="assets/logo.png" alt=""></a>
    <a class="nav-item" href="chat.html"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="nav-label">对话</span></a>
    <a class="nav-item" href="recommend.html"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M16 3a8 8 0 0 1 5 5h-5z"/></svg><span class="nav-label">推荐</span></a>
    <a class="nav-item" href="account.html"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 9h18m-5 5h3"/></svg><span class="nav-label">账户</span></a>
    <a class="nav-item active" href="mine.html" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="nav-label">我的</span></a>
    <a class="nav-item nav-workbench" href="copilot.html"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V3h8v4M3 12h18m-11 0v3h4v-3"/></svg><span class="nav-label">工作台</span></a>
  </nav>

  <main class="main" id="mainContent" tabindex="-1">
    <header class="header">
      <div class="header-identity"><a class="brand" href="index.html" aria-label="Navren首页">Navren</a><span class="header-location">偏好与设置</span></div>
      <label class="mode-control"><span>界面模式</span><select id="interfaceMode" aria-label="界面模式"><option value="classic">经典版</option><option value="senior">关怀版</option><option value="youth">青春版</option></select></label>
    </header>

    <div class="page-scroll">
    <div class="mine-page">
      <div class="page-heading"><span class="eyebrow">我的 Navren</span><h1>按你的习惯，调整 Navren。</h1><p>选择阅读方式、管理个人档案，让每次使用都更顺手。</p></div>


      <div class="profile-card">
        <div class="p-avatar" id="profileAvatar" onclick="document.getElementById('avatarInput').click()" title="点击上传头像">👤</div>
        <input type="file" id="avatarInput" accept="image/*" onchange="handleAvatarUpload(event)" style="display:none;">
        <div style="flex:1">
          <div class="p-name" id="profileName">张三</div>
          <div class="p-actions">
            <button class="p-btn" onclick="editProfile()">编辑资料</button>
            <button class="p-btn" onclick="switchAccount()">切换账号</button>
            <button class="p-btn" onclick="logout()">退出</button>
          </div>
        </div>
      </div>

      <div class="mine-section">
        <div class="sec-label">阅读与语音</div>
        <div class="card">
          <div style="font-size:var(--font-size-xs);color:var(--ink-40);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.06em;font-weight:700">界面模式</div>
          <div class="mode-row" id="modeSelector" style="margin-bottom:var(--s2)"></div>
          <div style="font-size:var(--font-size-xs);color:var(--ink-40);margin:14px 0 10px;text-transform:uppercase;letter-spacing:0.06em;font-weight:700">字体大小</div>
          <div class="font-row" id="fontSizeRow" style="margin-bottom:var(--s2)"></div>
          <div class="trow">
            <div><div class="tl">语音播报</div><div class="td">AI 回复自动朗读，朗读完毕自动续听</div></div>
            <div class="toggle" id="voiceToggle" onclick="toggleVoice()"></div>
          </div>
          <div class="collapsible" style="margin-top:12px">
            <div class="col-head" onclick="this.parentElement.classList.toggle('open')">
              <div class="col-title">
                <svg class="col-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                语音音色
              </div>
              <span class="col-arrow">▼</span>
            </div>
            <div class="col-body" id="voicePresetRow"></div>
          </div>
        </div>
      </div>

      <div class="mine-section">
        <div class="sec-label">理财偏好</div>
        <div class="card" id="riskCard">
          <div class="sec-label">聊天风险偏好</div>
          <div id="riskDetail"></div>
        </div>
        <div class="collapsible">
          <div class="col-head" onclick="this.parentElement.classList.toggle('open')">
            <div class="col-title">
              <svg class="col-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              个性化推荐
            </div>
            <span class="col-arrow">▼</span>
          </div>
          <div class="col-body" id="prefsBody"></div>
        </div>
      </div>

      <div class="mine-section">
        <div class="sec-label">个人档案</div>
        <div id="profileCompletion"></div>
        <div class="collapsible">
          <div class="col-head" onclick="this.parentElement.classList.toggle('open')">
            <div class="col-title">
              <svg class="col-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              个人档案
            </div>
            <span class="col-arrow">▼</span>
          </div>
          <div class="col-body" id="archiveContent"></div>
        </div>
      </div>

      <!-- 我的收藏 -->
      <div class="mine-section">
        <div class="sec-label">我的收藏</div>
        <div class="collapsible">
          <div class="col-head" onclick="this.parentElement.classList.toggle('open')">
            <div class="col-title">
              <svg class="col-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              我的收藏
            </div>
            <span class="col-arrow">▼</span>
          </div>
          <div class="col-body" id="bookmarksList"></div>
        </div>
      </div>


    </div>
    </div>
  </main>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-head"><span id="modalTitle">编辑</span><button onclick="closeModal()" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-40)">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot"><button class="btn-outline" style="padding:8px 18px;border-radius:8px;font-size:var(--font-size-sm)" onclick="closeModal()">取消</button><button class="btn-primary" style="padding:8px 18px;border-radius:8px;font-size:var(--font-size-sm)" id="modalConfirm">确认</button></div>
  </div>
</div>

<script src="js/storage.js?v=ui-20261003-3"></script>
<script src="js/design.js?v=ui-20261003-3"></script>
<script src="js/profile_engine.js?v=7"></script>
<script src="js/mine.js?v=ui-20261003-3"></script>
</body>
</html>
