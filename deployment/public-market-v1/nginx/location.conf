# Four GET route shapes are validated again by the authentication gateway.
location ^~ /api/public-market/v1/ {
    if ($request_method != GET) { return 405; }
    limit_req zone=navren_market_ip burst=12 nodelay;
    limit_req zone=navren_market_global burst=20 nodelay;
    limit_req_status 429;
    limit_conn navren_market_connections 4;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:60291;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host 127.0.0.1:60291;
    proxy_set_header Origin $navren_upstream_origin;
    proxy_set_header Sec-Fetch-Site $navren_upstream_fetch_site;
    proxy_set_header Accept application/json;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_send_timeout 8s;
}
