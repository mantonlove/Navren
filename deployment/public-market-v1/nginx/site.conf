server {
    listen 80;
    listen [::]:80;
    server_name navren.cn www.navren.cn;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://navren.cn$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name navren.cn www.navren.cn;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/navren.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/navren.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NavrenTLS:10m;
    ssl_session_tickets off;
    access_log /var/log/nginx/navren-public-access.log;
    access_log /var/log/nginx/navren-performance.log navren_performance_timing;
    error_log /var/log/nginx/navren-public-error.log;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    client_max_body_size 25m;
    if ($host = www.navren.cn) { return 308 https://navren.cn$request_uri; }
    if ($navren_origin_ok = 0) { return 403; }

    include /etc/nginx/snippets/navren-public-market.conf;

    # navren-public-static-performance-20261021
    location ~ ^/(?:js|css|assets)/.+\.(?:js|css|json|png|jpg|jpeg|webp|svg|ico|woff|woff2|ttf)$ {
        root /opt/navren/releases/navren-20261022-market-cutover-1/app;
        try_files $uri =404;
        autoindex off;
        disable_symlinks on from=$document_root;
        limit_except GET HEAD { deny all; }
        etag on;
        if_modified_since exact;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 4;
        gzip_types application/javascript text/javascript text/css application/json image/svg+xml;
    }
    location = /api/speech/ws {
        if ($http_origin != "https://navren.cn") { return 403; }
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_pass http://127.0.0.1:60291;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:60291;
        proxy_set_header Origin $navren_upstream_origin;
        proxy_set_header Sec-Fetch-Site $navren_upstream_fetch_site;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_cookie_flags navren_welcome_session secure httponly samesite=strict;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

    }
    location ^~ /api/welcome/ {
        limit_req zone=navren_public_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";

        proxy_pass http://127.0.0.1:60291;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:60291;
        proxy_set_header Origin $navren_upstream_origin;
        proxy_set_header Sec-Fetch-Site $navren_upstream_fetch_site;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_cookie_flags navren_welcome_session secure httponly samesite=strict;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

    }
    location / {
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        sub_filter_once on;
        sub_filter '</body>' '<div style="position:fixed;bottom:3px;right:8px;z-index:10;font-size:10px;line-height:14px;background:rgba(255,255,255,.85);border-radius:3px;padding:0 4px"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer" style="color:#777;text-decoration:none">渝ICP备2026025240号</a></div></body>';

        proxy_pass http://127.0.0.1:60291;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:60291;
        proxy_set_header Origin $navren_upstream_origin;
        proxy_set_header Sec-Fetch-Site $navren_upstream_fetch_site;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_cookie_flags navren_welcome_session secure httponly samesite=strict;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

    }
}
