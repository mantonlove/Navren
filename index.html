<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Navren — 智慧银行理财顾问</title>
<link rel="stylesheet" href="css/style.css?v=ui-20261003-3">
<style>
  body { background: var(--surface); }
</style>
<link rel="stylesheet" href="css/design.css?v=ui-20261003-3">
<link rel="icon" type="image/png" href="assets/logo.png">
</head>
<body data-page="index">

<div class="welcome-page">
  <a class="welcome-brand" href="index.html"><img src="assets/logo.png" alt="">Navren</a>
  <div class="wl-tag">从容安排每一笔钱</div>
  <h1>看清财务，<br>再做下一步决定。</h1>
  <p class="wl-sub">看懂账单，比较产品，理清资金安排。选择你习惯的阅读方式，从一段对话开始。</p>

  <div class="wl-cards">
    <!-- 经典版 -->
    <div class="wl-card">
      <div class="wc-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 18v-7"/><path d="M11.119 2.205a2 2 0 0 1 1.762 0l7.84 3.846A.5.5 0 0 1 20.5 7h-17a.5.5 0 0 1-.22-.949z"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="M3 22h18"/><path d="M6 18v-7"/></svg>
      </div>
      <div class="wc-name">经典版</div>
      <div class="wc-who">清晰有序，舒适阅读</div>
      <ul class="wc-features">
        <li>资产与支出分区呈现</li>
        <li>风险、期限与金额一起看</li>
        <li>关键信息保留完整说明</li>
      </ul>
      <button class="wc-btn" type="button" onclick="enter('classic')">进入经典版<span aria-hidden="true"> →</span></button>
    </div>

    <!-- 关怀版 -->
    <div class="wl-card">
      <div class="wc-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19.414 14.414C21 12.828 22 11.5 22 9.5a5.5 5.5 0 0 0-9.591-3.676.6.6 0 0 1-.818.001A5.5 5.5 0 0 0 2 9.5c0 2.3 1.5 4 3 5.5l5.535 5.362a2 2 0 0 0 2.879.052 2.12 2.12 0 0 0-.004-3 2.124 2.124 0 1 0 3-3 2.124 2.124 0 0 0 3.004 0 2 2 0 0 0 0-2.828l-1.881-1.882a2.41 2.41 0 0 0-3.409 0l-1.71 1.71a2 2 0 0 1-2.828 0 2 2 0 0 1 0-2.828l2.823-2.762"/></svg>
      </div>
      <div class="wc-name">关怀版</div>
      <div class="wc-who">字更大，操作更从容</div>
      <ul class="wc-features">
        <li>更大的字号与操作按钮</li>
        <li>更宽松的间距与阅读节奏</li>
        <li>支持语音输入和回复朗读</li>
      </ul>
      <button class="wc-btn" type="button" onclick="enter('senior')">进入关怀版<span aria-hidden="true"> →</span></button>
    </div>

    <!-- 青春版 -->
    <div class="wl-card">
      <div class="wc-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/></svg>
      </div>
      <div class="wc-name">青春版</div>
      <div class="wc-who">白色界面，轻快浏览</div>
      <ul class="wc-features">
        <li>纯白底色，重点清晰</li>
        <li>紧凑排版，减少来回寻找</li>
        <li>直达账单、产品与账户</li>
      </ul>
      <button class="wc-btn" type="button" onclick="enter('youth')">进入青春版<span aria-hidden="true"> →</span></button>
    </div>
  </div>
  <p class="welcome-note">三个模式提供相同功能，随时可以切换。当前银行操作使用本机模拟账户。</p>
</div>

<script src="js/storage.js?v=ui-20261003-3"></script>
<script>
function enter(mode) {
  Storage.set('qingzhou_mode', mode);
  NavrenApp.navigate('chat.html', mode);
}
</script>
</body>
</html>
