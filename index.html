<script data-navren-theme-bootstrap>
(() => {
  try {
    const theme=localStorage.getItem('navren:paint-theme:v1');
    if(theme!=='light'&&theme!=='dark')return;
    const root=document.documentElement;
    root.dataset.theme=theme;root.style.colorScheme=theme;
    root.style.backgroundColor=theme==='dark'?'#0d1725':'#edf3fa';
  } catch(_) {}
})();
</script>

<script>
async function enter(mode) {
  try {
    await Storage.ready();
    const previous = getInterfaceMode();
    await Storage.setMany({qingzhou_mode:mode,qingzhou_fontSize:getModeFont(mode),qingzhou_modeFontSizes:{...(Storage.get(STORAGE_KEYS.MODE_FONT_SIZES)||{}),[previous]:getModeFont(previous)}});
    await Storage.set('navren_onboarded', true);
    NavrenApp.navigate('chat.html', mode);
  } catch (_) { showToast('请先登录并选择体验账户。'); }
}
</script>
