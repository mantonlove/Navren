<body data-page="chat">

    <a class="logo" href="chat.html" aria-label="Navren首页"><img class="brand-icon" src="assets/brand/navren-icon.png" width="1254" height="1254" alt=""></a>
    <a class="nav-item active" href="chat.html" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="nav-label">对话</span></a>
    <a class="nav-item" href="account.html"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 9h18m-5 5h3"/></svg><span class="nav-label">账户</span></a>
    <a class="nav-item" href="recommend.html"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M16 3a8 8 0 0 1 5 5h-5z"/></svg><span class="nav-label">发现</span></a>
    <a class="nav-item" href="mine.html"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="nav-label">我的</span></a>
  </nav>

  <main class="main" id="mainContent" tabindex="-1">
    <header class="header">
      <div class="header-identity"><a class="brand" href="chat.html" aria-label="Navren首页"><img class="brand-wordmark" src="assets/brand/navren-wordmark.png" width="2172" height="724" alt=""></a><h1 class="header-location">银行与生活助手</h1></div>

    </header>
    <section id="accountSwitcher" aria-label="演示账户" class="account-switcher" hidden></section>

    <div class="chat-messages" id="chatMessages">
      <div class="message ai">
        <div class="avatar"><img class="brand-icon" src="assets/brand/navren-icon.png" width="1254" height="1254" alt=""></div>
          <div class="bubble">
            <div class="sender">Navren</div>
            <div class="message-body message-prose"><span id="welcomeMsg">您好，我是Navren，您的智慧银行理财顾问。请问有什么可以帮您？</span></div>
          </div>
          <div class="preset-inline message-suggestions" id="presetBar"></div>
      </div>
    </div>

    <div class="privacy-guide hidden" id="privacyGuide" data-i18n-skip>
      <h4 id="privacyTitle">隐私与个性化服务说明</h4>
      <p>为提供更贴合你的银行与生活财务服务，Navren会在对话中了解您的投资偏好和资产情况，并建立个人档案。</p>
      <ul>
        <li>对话与模拟账户记录保存在本机；回答问题所需的账户摘要会发送至 DeepSeek 和 GLM</li>
          <li>使用语音时，录音和待朗读文字发送至阿里云百炼处理；语音消息仅保存在当前浏览器，供你回放</li>
        <li>未经您确认，不会用于其他用途</li>
        <li>聊天授权在「我的」中管理；模拟风险与资金设置请在「账户」中修改</li>
      </ul>
      <div class="privacy-actions"><button onclick="acceptPrivacy()">我知道了</button></div>
    </div>

    <div class="image-preview-row hidden" id="imagePreview">
      <img id="previewImg" src="" alt="">
      <button class="remove-img" onclick="removeImage()">✕</button>
    </div>

    <div class="chat-input-area">
      <div class="input-row">
        <input type="file" id="imageInput" accept="image/*" capture="environment" onchange="handleImageUpload(event)" style="display:none;">
        <button class="ib-btn" onclick="triggerUpload()" title="上传图片或拍照">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <textarea id="userInput" rows="1" placeholder="查账单、安排转账、管理卡片或聊聊你的计划…" onkeydown="handleKeyDown(event)"></textarea>
        <button class="ib-btn" id="voiceBtn" onclick="toggleVoice()" title="语音输入（说出您的问题）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <button class="ib-btn" onclick="triggerHandoff('用户主动请求人工')" title="转接人工理财顾问">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
        <button class="ib-btn send-btn" onclick="sendMessage()" id="sendBtn" disabled title="发送消息">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
      <div class="voice-status" id="voiceStatus" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>
  </main>
</div>
